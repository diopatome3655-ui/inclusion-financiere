[project]
name = "inclusion-financiere"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "diopatome3655-ui", email = "diopatome3655@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "xgboost>=3.4.1",
]

[project.scripts]
inclusion-financiere = "inclusion_financiere:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
